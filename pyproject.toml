[project]
name = "kite-trade"
version = "0.1.0"
description = "Kite Connect trading dashboard: FastAPI backend + Streamlit UI"
authors = [
    { name = "sidheshparab", email = "sidheshparab34@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "kiteconnect>=5.2.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "streamlit-lightweight-charts>=0.7.20",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
